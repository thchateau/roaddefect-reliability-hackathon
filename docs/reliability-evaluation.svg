<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Reliability evaluation at a five percent false-alarm target</title>
  <desc id="desc">A chart showing reliability score peaking when the false-alarm rate reaches five percent, alongside a confidence calibration diagram.</desc>
  <rect width="1200" height="470" rx="24" fill="#f8fafc"/>
  <text x="55" y="55" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Reliability is part of the score</text>
  <text x="55" y="84" font-family="Arial, sans-serif" font-size="16" fill="#475569">The target operating point is not “zero predictions”; it is controlled, useful risk.</text>

  <g transform="translate(70,125)" font-family="Arial, sans-serif">
    <text x="210" y="0" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a8a">Reliability@5</text>
    <line x1="55" y1="255" x2="430" y2="255" stroke="#334155" stroke-width="2"/>
    <line x1="55" y1="35" x2="55" y2="255" stroke="#334155" stroke-width="2"/>
    <line x1="55" y1="145" x2="430" y2="145" stroke="#cbd5e1" stroke-dasharray="6 6"/>
    <line x1="242" y1="35" x2="242" y2="255" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 6"/>
    <path d="M55 255 L100 225 L150 180 L200 125 L242 35 L285 125 L335 180 L385 225 L430 255" fill="none" stroke="#2563eb" stroke-width="5"/>
    <circle cx="242" cy="35" r="7" fill="#16a34a"/>
    <text x="242" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">target = 5%</text>
    <text x="242" y="286" text-anchor="middle" font-size="14" fill="#475569">false-alarm rate</text>
    <text x="50" y="275" text-anchor="end" font-size="13" fill="#475569">0%</text>
    <text x="242" y="275" text-anchor="middle" font-size="13" fill="#475569">5%</text>
    <text x="430" y="275" text-anchor="end" font-size="13" fill="#475569">10%</text>
    <text x="43" y="260" text-anchor="end" font-size="13" fill="#475569">0</text>
    <text x="43" y="40" text-anchor="end" font-size="13" fill="#475569">1</text>
  </g>

  <g transform="translate(625,125)" font-family="Arial, sans-serif">
    <text x="225" y="0" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a8a">Confidence calibration</text>
    <line x1="50" y1="255" x2="430" y2="35" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/>
    <path d="M50 255 C110 230 130 210 175 190 S250 140 290 130 S365 75 430 68" fill="none" stroke="#f97316" stroke-width="5"/>
    <circle cx="112" cy="224" r="6" fill="#f97316"/>
    <circle cx="185" cy="182" r="6" fill="#f97316"/>
    <circle cx="265" cy="141" r="6" fill="#f97316"/>
    <circle cx="350" cy="97" r="6" fill="#f97316"/>
    <text x="240" y="286" text-anchor="middle" font-size="14" fill="#475569">predicted confidence</text>
    <text x="10" y="150" transform="rotate(-90 10 150)" text-anchor="middle" font-size="14" fill="#475569">observed accuracy</text>
    <text x="430" y="325" text-anchor="end" font-size="14" fill="#475569">dashed = perfect calibration</text>
  </g>
</svg>
