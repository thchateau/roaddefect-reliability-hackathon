<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Road defect detection pipeline</title>
  <desc id="desc">A diagram showing images flowing through a detector, calibration and thresholding, and into a submission file.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <text x="60" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">From road images to reliable predictions</text>
  <text x="60" y="88" font-family="Arial, sans-serif" font-size="16" fill="#475569">A detector is only one part of a trustworthy road-inspection system.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="145" width="210" height="170" rx="18" fill="#ffffff"/>
    <rect x="295" y="145" width="210" height="170" rx="18" fill="#ffffff"/>
    <rect x="535" y="145" width="210" height="170" rx="18" fill="#ffffff"/>
    <rect x="775" y="145" width="210" height="170" rx="18" fill="#ffffff"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="160" y="180" font-size="19" font-weight="700" fill="#1e3a8a">1. Image data</text>
    <text x="160" y="211" font-size="15" fill="#475569">RDD2022 + unlabeled</text>
    <text x="160" y="235" font-size="15" fill="#475569">road images</text>
    <rect x="105" y="257" width="110" height="35" rx="7" fill="#dbeafe"/>
    <path d="M121 283 L137 263 L151 276 L165 267 L197 289 Z" fill="#2563eb"/>
    <circle cx="181" cy="267" r="6" fill="#f59e0b"/>

    <text x="400" y="180" font-size="19" font-weight="700" fill="#1e3a8a">2. Detector</text>
    <text x="400" y="211" font-size="15" fill="#475569">YOLO, DETR, CNN</text>
    <text x="400" y="235" font-size="15" fill="#475569">or foundation model</text>
    <rect x="348" y="260" width="104" height="30" rx="15" fill="#ede9fe"/>
    <text x="400" y="281" font-size="14" font-weight="700" fill="#6d28d9">boxes + scores</text>

    <text x="640" y="180" font-size="19" font-weight="700" fill="#1e3a8a">3. Reliability</text>
    <text x="640" y="211" font-size="15" fill="#475569">Calibration, BALD</text>
    <text x="640" y="235" font-size="15" fill="#475569">or conformal methods</text>
    <path d="M584 282 L610 282 L610 266 L636 266 L636 282 L662 282 L662 251 L688 251 L688 282" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="880" y="180" font-size="19" font-weight="700" fill="#1e3a8a">4. Submission</text>
    <text x="880" y="211" font-size="15" fill="#475569">Class, box, confidence</text>
    <text x="880" y="235" font-size="15" fill="#475569">for every test image</text>
    <rect x="824" y="258" width="112" height="31" rx="6" fill="#dcfce7"/>
    <text x="880" y="279" font-size="14" font-weight="700" fill="#166534">JSONL</text>
  </g>

  <path d="M267 230 H287" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M507 230 H527" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M747 230 H767" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="600" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">Aim for accurate detections at an operating point close to the 5% false-alarm target.</text>
</svg>
